name: Keep Streamlit App Alive

on:
  schedule:
    # Run every 6 hours (UTC 00:00, 06:00, 12:00, 18:00 / KST 09:00, 15:00, 21:00, 03:00)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Streamlit App URL to ping'
        required: false
        default: ''

jobs:
  keep-alive:
    name: Ping Streamlit App
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Request
        env:
          TARGET_URL: ${{ inputs.target_url || secrets.STREAMLIT_APP_URL || 'https://news9media.streamlit.app' }}
        run: |
          echo "Target URL: $TARGET_URL"
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            --max-time 60 \
            "$TARGET_URL")
          echo "Received HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Success: Streamlit app is active and responsive."
          else
            echo "Notice: Non-2xx/3xx response ($HTTP_STATUS). The app may be waking up or URL requires check."
          fi
